[project]
name = "openagentpay-bedrock-agentcore"
version = "0.1.0a0"
description = "AWS Bedrock AgentCore tool descriptor for OpenAgentPay — EXTENDS AgentCore Payments to non-CDP/non-Privy wallets via OpenAgentPay's pluggable wallet/protocol infrastructure (Path-D Hybrid)."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Neo Sun", email = "neosun100@github" }]
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.6.0",
]
keywords = ["bedrock", "agentcore", "aws", "ai-agent", "payments", "x402"]

[project.optional-dependencies]
# AgentCore SDK is OPTIONAL — the tool descriptor + handler work as plain
# Python without it. Install the [agentcore] extra for full AgentCore wiring.
agentcore = [
  "bedrock-agentcore>=0.1.0",
]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-mock>=3.12.0",
  "respx>=0.21.0",
  "ruff>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/neosun100/openAgentPay"
Repository = "https://github.com/neosun100/openAgentPay"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openagentpay_bedrock_agentcore"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
